on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: install-check

permissions: read-all

jobs:
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          dependencies: "hard"

      - name: Smoke test core install
        run: |
          library(ProtPipe)
          stopifnot("run_protpipe_shiny" %in% getNamespaceExports("ProtPipe"))
        shell: Rscript {0}

  full-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          dependencies: "true"

      - name: Smoke test optional dependencies
        run: |
          library(ProtPipe)
          ProtPipe:::protpipe_require_app_packages()
          stopifnot(requireNamespace("clusterProfiler", quietly = TRUE))
          stopifnot(requireNamespace("enrichplot", quietly = TRUE))
          stopifnot(requireNamespace("DOSE", quietly = TRUE))
        shell: Rscript {0}
